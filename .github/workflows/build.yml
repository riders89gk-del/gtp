name: Windows 실행파일 만들기

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - main.js
      - preload.js
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 필요한 파일 설치
        run: npm install --no-audit --no-fund

      - name: Windows 실행파일 만들기
        run: npm run build

      - name: 실행파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: PROMO_CORE_윈도우용
          path: dist/PROMO_CORE_윈도우용.exe
          if-no-files-found: error
          retention-days: 30

      - name: 직원용 다운로드 공개
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create windows-v1.0.2 "dist/PROMO_CORE_윈도우용.exe" --title "PROMO CORE Windows 1.0.2" --notes "직원용 Windows 실행파일입니다. 다운로드 후 파일 하나만 실행하세요."
